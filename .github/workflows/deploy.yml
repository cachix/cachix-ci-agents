name: Build & Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# PRs: cancel previous run on push.
# main: run sequentially, waiting for previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CACHE_NAME: cachix-ci-agents

jobs:
  build:
    strategy:
      matrix:
        os:
          - [ubuntu-latest]
          - [ubuntu-26.04-arm]
          - [macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - run: sudo rm -rf /opt&
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: ${{ env.CACHE_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Version info
        run: nix --version
      - name: Build
        run: |
          system=$(nix eval --raw --impure --expr 'builtins.currentSystem')
          nix build -L --print-out-paths --accept-flake-config ".#deploy-$system"
          cp result deploy.json
          # Wait for all paths to flush to daemon. TODO: fix upstream.
          sleep 3
      - uses: actions/upload-artifact@v7
        with:
          name: deploy-${{ runner.os }}-${{ runner.arch }}
          path: deploy.json
          if-no-files-found: error

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: ${{ env.CACHE_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - uses: actions/download-artifact@v8
        with:
          pattern: deploy-*
          path: deploy-specs
      - name: Deploy
        env:
          CACHIX_ACTIVATE_TOKEN: ${{ secrets.CACHIX_ACTIVATE_TOKEN }}
        run: |
          jq -s '{agents: (map(.agents) | add)}' deploy-specs/*/deploy.json > deploy.json
          cachix deploy activate deploy.json
