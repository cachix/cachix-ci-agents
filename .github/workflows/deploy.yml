name: Build & Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# PRs: cancel previous run on push.
# main: run sequentially, waiting for previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CACHE_NAME: cachix-ci-agents

jobs:
  build:
    strategy:
      matrix:
        os:
          - [ubuntu-latest]
          - [ubuntu-24.04-arm]
          - [macos-latest]
    runs-on: ${{ matrix.os }}
    outputs:
      gh-runner-x86_64-linux-01: ${{ steps.agent.outputs.gh-runner-x86_64-linux-01 }}
      gh-runner-aarch64-linux-01: ${{ steps.agent.outputs.gh-runner-aarch64-linux-01 }}
      gh-runner-aarch64-darwin-01: ${{ steps.agent.outputs.gh-runner-aarch64-darwin-01 }}
      gh-runner-aarch64-darwin-02: ${{ steps.agent.outputs.gh-runner-aarch64-darwin-02 }}
    steps:
      - run: sudo rm -rf /opt&
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: ${{ env.CACHE_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Version info
        run: nix --version
      - name: Build
        id: agent
        run: |
          system=$(nix eval --raw --impure --expr 'builtins.currentSystem')
          case "$system" in
            x86_64-linux) machines="gh-runner-x86_64-linux-01" ;;
            aarch64-linux) machines="gh-runner-aarch64-linux-01" ;;
            aarch64-darwin) machines="gh-runner-aarch64-darwin-01 gh-runner-aarch64-darwin-02" ;;
            *) echo "No machines for $system" >&2; exit 1 ;;
          esac
          for machine in $machines; do
            echo "Building $machine"
            out_path=$(nix build -L --print-out-paths --accept-flake-config ".#$machine")
            echo "Built $out_path"
            echo "$machine=$out_path" >> "$GITHUB_OUTPUT"
          done
          # Wait for all paths to flush to daemon. TODO: fix upstream.
          sleep 3

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: ${{ env.CACHE_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Deploy
        env:
          CACHIX_ACTIVATE_TOKEN: ${{ secrets.CACHIX_ACTIVATE_TOKEN }}
        run: |
          cat << EOF >> deploy.json
          {
            "agents": {
              "linux": "${{ needs.build.outputs.gh-runner-x86_64-linux-01 }}",
              "aarch64-linux": "${{ needs.build.outputs.gh-runner-aarch64-linux-01 }}",
              "macos": "${{ needs.build.outputs.gh-runner-aarch64-darwin-01 }}",
              "gh-runner-aarch64-darwin-02": "${{ needs.build.outputs.gh-runner-aarch64-darwin-02 }}"
            }
          }
          EOF
          cachix deploy activate deploy.json
